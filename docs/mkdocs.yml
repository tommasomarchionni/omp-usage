site_name: omp-usage
site_description: OMP usage tracking plugin and Prometheus exporter
site_author: Tommaso Marchionni
site_url: https://tommasomarchionni.github.io/omp-usage/
repo_url: https://github.com/tommasomarchionni/omp-usage
repo_name: tommasomarchionni/omp-usage
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Tommaso Marchionni
docs_dir: .
exclude_docs: |
  requirements.txt
site_dir: ../site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - codehilite:
      linenums: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Plugin: plugin.md
  - Exporter: exporter.md
  - Metrics: metrics.md
  - Pricing & Equivalent Cost: pricing.md
  - Prometheus: prometheus.md
  - Grafana: grafana.md
  - Grafana dashboards v2: grafana-v2.md
  - launchd (macOS): launchd.md
  - Troubleshooting: troubleshooting.md
  - Persistence & Recovery: persistence.md
  - Shutdown: shutdown.md
  - Testing: testing.md
  - Releasing & Security: releasing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tommasomarchionni/omp-usage
