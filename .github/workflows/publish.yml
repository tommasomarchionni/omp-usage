name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-plugin:
    name: Publish @tommasomarchionni/omp-usage
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'omp-usage-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate NPM_TOKEN identity
        env:
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_FALLBACK_TOKEN:-}" ]; then
            echo "NPM_TOKEN not configured."
            exit 0
          fi

          temp_npmrc="$(mktemp)"
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_FALLBACK_TOKEN" > "$temp_npmrc"
          NPM_CONFIG_USERCONFIG="$temp_npmrc" npm whoami
          rm -f "$temp_npmrc"
      - name: Publish plugin package (OIDC, fallback to NPM_TOKEN)
        working-directory: packages/omp-usage
        env:
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm publish --access public --provenance
          publish_exit=$?
          set -e

          if [ "$publish_exit" -eq 0 ]; then
            exit 0
          fi

          if [ -z "${NPM_FALLBACK_TOKEN:-}" ]; then
            echo "OIDC publish failed and NPM_TOKEN is not configured."
            exit "$publish_exit"
          fi

          echo "OIDC publish failed, retrying with NPM_TOKEN fallback."
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_FALLBACK_TOKEN" > "$HOME/.npmrc"
          npm publish --access public

  publish-exporter:
    name: Publish @tommasomarchionni/omp-usage-exporter
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'omp-usage-exporter-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate NPM_TOKEN identity
        env:
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_FALLBACK_TOKEN:-}" ]; then
            echo "NPM_TOKEN not configured."
            exit 0
          fi

          temp_npmrc="$(mktemp)"
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_FALLBACK_TOKEN" > "$temp_npmrc"
          NPM_CONFIG_USERCONFIG="$temp_npmrc" npm whoami
          rm -f "$temp_npmrc"
      - name: Publish exporter package (OIDC, fallback to NPM_TOKEN)
        working-directory: packages/omp-usage-exporter
        env:
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm publish --access public --provenance
          publish_exit=$?
          set -e

          if [ "$publish_exit" -eq 0 ]; then
            exit 0
          fi

          if [ -z "${NPM_FALLBACK_TOKEN:-}" ]; then
            echo "OIDC publish failed and NPM_TOKEN is not configured."
            exit "$publish_exit"
          fi

          echo "OIDC publish failed, retrying with NPM_TOKEN fallback."
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_FALLBACK_TOKEN" > "$HOME/.npmrc"
          npm publish --access public
