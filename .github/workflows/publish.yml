name: Publish to npm

# Publishing uses npm Trusted Publishing (OIDC) only: no long-lived npm token
# is stored in the repository. Every release gets a provenance attestation.
#
# Triggered by release-please.yml through workflow_dispatch (releases created
# with GITHUB_TOKEN do not trigger `release` events), or manually for a tag.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options: [omp-usage, omp-usage-exporter]
      tag:
        description: Release tag (e.g. omp-usage-v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }} (${{ inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers for this environment in the repository
    # settings, and use it in the npm Trusted Publisher configuration.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tommasomarchionni/${{ inputs.package }}
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing and provenance
    steps:
      - name: Validate inputs
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^${PACKAGE}-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match package '$PACKAGE' (expected ${PACKAGE}-vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an npm version with Trusted Publishing support (>= 11.5.1)
        run: npm install --global npm@11 && npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration

      - name: Check version and registry state
        id: check
        working-directory: packages/${{ inputs.package }}
        env:
          TAG: ${{ inputs.tag }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "${PACKAGE}-v${version}" != "$TAG" ]; then
            echo "::error::package.json version ${version} does not match tag ${TAG}"
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance (OIDC)
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/${{ inputs.package }}
        run: npm publish --provenance --access public
