name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-plugin:
    name: Publish @tommasomarchionni/omp-usage
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'omp-usage-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish plugin package
        run: npm publish --workspace=@tommasomarchionni/omp-usage --access public --provenance

  publish-exporter:
    name: Publish @tommasomarchionni/omp-usage-exporter
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'omp-usage-exporter-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish exporter package
        run: npm publish --workspace=@tommasomarchionni/omp-usage-exporter --access public --provenance
